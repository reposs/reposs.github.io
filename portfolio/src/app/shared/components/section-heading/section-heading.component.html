<div class="section-heading text-center">
  @if (index() || kicker()) {
    <div class="section-kicker">
      @if (index()) {
        <span class="kicker-index">{{ index() }}</span>
      }
      @if (kicker()) {
        <span>{{ kicker() }}</span>
      }
    </div>
  }

  <h2 class="section-title">
    @if (title()) {
      {{ title() }}
    } @else {
      <ng-content select="[heading-title]"></ng-content>
    }
  </h2>

  @if (subtitle()) {
    <p class="section-subtitle">{{ subtitle() }}</p>
  } @else {
    <ng-content select="[heading-subtitle]"></ng-content>
  }
</div>
